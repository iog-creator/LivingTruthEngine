version: '3.8'
services:
  veritas_api:
    build:
      context: ..
      dockerfile: apps/veritas_api/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://living-truth-redis:6379/0}
      - DATA_ROOT=/app/data
      - RUNS_ROOT=/app/data/runs
    volumes:
      - ../apps/veritas_api:/app
      - ../data:/app/data
    ports: ["8080:8080"]
    depends_on:
      - redis
    networks:
      - living-truth-network

  veritas_worker:
    build:
      context: ..
      dockerfile: apps/veritas_worker/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://living-truth-redis:6379/0}
      - DATA_ROOT=/app/data
      - RUNS_ROOT=/app/data/runs
    volumes:
      - ../apps/veritas_worker:/app
      - ../data:/app/data
    depends_on:
      - veritas_api
      - redis
    networks:
      - living-truth-network

  veritas_console:
    build:
      context: ..
      dockerfile: apps/veritas_console/Dockerfile
    environment:
      - API_BASE=http://veritas_api:8080
    volumes:
      - ../apps/veritas_console:/app
      - ../data:/app/data
    ports: ["8501:8501"]
    depends_on:
      - veritas_api
    networks:
      - living-truth-network

networks:
  living-truth-network:
    external: true
    name: living-truth-network

