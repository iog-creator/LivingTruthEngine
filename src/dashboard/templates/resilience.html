{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">Resilience Dashboard</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Resilience Score Gauge -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Resilience Score</h2>
            <div data-testid="resilience-gauge" class="text-4xl font-bold text-blue-600">86.0</div>
        </div>
        
        <!-- Chaos Results Table -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Chaos Engineering Results</h2>
            <table data-testid="chaos-results-table" class="w-full">
                <thead>
                    <tr class="border-b">
                        <th class="text-left py-2">Scenario</th>
                        <th class="text-left py-2">Status</th>
                        <th class="text-left py-2">Recovery Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b">
                        <td class="py-2">cpu_pressure</td>
                        <td class="py-2 text-green-600">Recovered</td>
                        <td class="py-2">9s</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Trends Chart -->
        <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
            <h2 class="text-xl font-semibold mb-4">Resilience Trends</h2>
            <div data-testid="trends-chart" class="h-64 bg-gray-100 rounded flex items-center justify-center">
                <span class="text-gray-500">series: 24</span>
            </div>
        </div>
        
        <!-- Filter Controls -->
        <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
            <h2 class="text-xl font-semibold mb-4">Filters</h2>
            <div class="flex gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Chaos Scenario</label>
                    <input data-testid="chaos-filter-scenario" type="text" value="cpu_pressure" class="border rounded px-3 py-2">
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
