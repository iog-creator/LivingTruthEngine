name: SSOT Nightly (Full)
on:
  schedule:
    - cron: "37 3 * * *"
jobs:
  ssot_full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Verify SSOT (full sweep)
        env: { CI: "true" }
        run: python scripts/verify_complete_ssot_system.py --scope full --json reports/ssot_report.json --sarif reports/ssot_report.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: ssot-full-reports
          path: reports/
