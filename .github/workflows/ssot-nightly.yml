name: SSOT Nightly
on:
  schedule: [{cron: "17 7 * * *"}]
  workflow_dispatch:
jobs:
  ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install deps
        run: pip install -U pyyaml
      - name: MCP smoke (import)
        run: python scripts/mcp_smoke_list.py || true
      - name: SSOT snapshot + gates
        run: |
          mkdir -p reports
          python scripts/ssot_watchdog.py
          make meta-index && make meta-validate || true
      - uses: actions/upload-artifact@v4
        with:
          name: ssot-reports
          path: reports/*
