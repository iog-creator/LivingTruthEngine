name: SSOT Guard
on:
  pull_request:
  schedule:
    - cron: "7 2 * * *"
jobs:
  ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Verify SSOT bundle
        run: python scripts/verify_ssot_bundle.py
