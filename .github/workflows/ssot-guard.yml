name: SSOT Guard
on:
  pull_request:
  schedule:
    - cron: "7 2 * * *"
jobs:
  ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Verify SSOT (fast, deterministic)
        env: { CI: "true" }
        run: python scripts/verify_complete_ssot_system.py --scope fast --json reports/ssot_report.json --sarif reports/ssot_report.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: ssot-reports
          path: reports/
