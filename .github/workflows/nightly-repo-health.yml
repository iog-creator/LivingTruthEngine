name: Nightly Repo Health

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  repo-health:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install jq
        
    - name: Run repo inventory
      run: |
        python scripts/repo_inventory.py
        
    - name: Run doc audit
      run: |
        python scripts/doc_audit.py
        
    - name: Archive sweep
      run: |
        python - <<'PY'
        import json, os, shutil, re, glob
        inv = sorted(glob.glob("logs/repo_health/*.json"))[-1]
        with open(inv) as f: data = json.load(f)
        docs = [d["file"] for d in data.get("docs", []) if "/archive/" not in d["file"]]
        text = ""
        for p in ("README.md","MCP_REQUIREMENTS_REFERENCE.md","project_master_log.md"):
            if os.path.exists(p):
                with open(p, encoding="utf-8") as fh: text += fh.read()
        refd = {d for d in docs if os.path.basename(d) in text}
        to_archive = [d for d in docs if d not in refd and re.search(r'PHASE_[0-9_]+.*\.md$', d)]
        os.makedirs("archive/docs", exist_ok=True)
        for p in to_archive:
            dst = os.path.join("archive/docs", os.path.basename(p))
            if not os.path.exists(dst):
                shutil.move(p, dst)
        print(f"Archived {len(to_archive)} docs.")
        PY
        
    - name: Update README
      run: |
        python - <<'PY'
        from datetime import date
        import json, glob, os, re
        inv = sorted(glob.glob("logs/repo_health/*.json"))[-1]
        with open(inv) as f: data = json.load(f)
        services = [s["name"] for s in data.get("docker_services", []) if s.get("name") not in (None, "services")]
        tools = [t["name"] for t in data.get("mcp_tools", [])]
        readme = "README.md"
        template = f"""# Living Truth Engine — Phase 9

**Current focus:** 9.5.7 Resilience Dashboard UI  
**Last repo health run:** {date.today().isoformat()}

## Active MCP tools
- (autogenerated list below)
{"".join(f"- {t}\n" for t in tools[:50])}

## Active Docker services
{"".join(f"- {s}\n" for s in services[:50])}

## How to run
- `docker compose -f docker/docker-compose.yml up -d --build`
- App: http://localhost:8050
- CI smoke: `bash scripts/resilience_dashboard_test.sh`
"""
        open(readme, "w", encoding="utf-8").write(template)
        print("README.md updated.")
        PY
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "nightly: repo health sweep"
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
